[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "arcdvncli"
version = "0.1.0"
description = "ARCDVNCLI - AI coding agent for the terminal"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0", "rich>=13.0.0", "prompt-toolkit>=3.0.0"]

[project.scripts]
arcdvncli = "arcdvncli.cli:main"

[tool.setuptools.packages.find]
include = ["arcdvncli*"]
